<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" stroke="#00875A" stroke-width="2.5" fill="#0D1117"/>

  <!-- Mountains at bottom -->
  <path d="M20 88 L38 62 L48 74 L60 50 L72 74 L82 62 L100 88 Z" fill="#1C2733" stroke="#00875A" stroke-width="1"/>
  <path d="M55 54 L60 46 L65 54" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>

  <!-- Lynx head shape -->
  <path d="M60 30 C46 30 36 41 36 54 C36 64 41 71 48 75 L60 80 L72 75 C79 71 84 64 84 54 C84 41 74 30 60 30Z" fill="#fff"/>

  <!-- Left ear pointed -->
  <path d="M44 42 L35 20 L50 37Z" fill="#fff"/>
  <path d="M44 40 L38 25 L49 37Z" fill="#00875A"/>
  <!-- Left ear tufts -->
  <line x1="35" y1="20" x2="31" y2="13" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="20" x2="34" y2="12" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right ear pointed -->
  <path d="M76 42 L85 20 L70 37Z" fill="#fff"/>
  <path d="M76 40 L82 25 L71 37Z" fill="#00875A"/>
  <!-- Right ear tufts -->
  <line x1="85" y1="20" x2="89" y2="13" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="85" y1="20" x2="86" y2="12" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Eyes - amber/orange -->
  <ellipse cx="49" cy="50" rx="6" ry="5.5" fill="#FF6D00"/>
  <ellipse cx="71" cy="50" rx="6" ry="5.5" fill="#FF6D00"/>
  <!-- Pupils -->
  <ellipse cx="50" cy="50" rx="2.8" ry="4" fill="#0D1117"/>
  <ellipse cx="72" cy="50" rx="2.8" ry="4" fill="#0D1117"/>
  <!-- Eye highlights -->
  <circle cx="47" cy="48" r="1.5" fill="#fff"/>
  <circle cx="69" cy="48" r="1.5" fill="#fff"/>

  <!-- Nose -->
  <path d="M56 60 L60 65 L64 60Z" fill="#333"/>

  <!-- Mouth -->
  <line x1="60" y1="65" x2="60" y2="68" stroke="#555" stroke-width="1"/>
  <path d="M54 69 Q60 74 66 69" stroke="#555" stroke-width="1.2" fill="none"/>

  <!-- Cheek fur / sideburns -->
  <path d="M38 55 Q36 63 39 71 Q42 75 48 75" stroke="#ddd" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M82 55 Q84 63 81 71 Q78 75 72 75" stroke="#ddd" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Forehead V marking -->
  <path d="M53 38 L60 33 L67 38" stroke="#00875A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>

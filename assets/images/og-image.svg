<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#e8c76a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle ice pattern lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#1e293b" stroke-width="1" opacity="0.5"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Puck icon (centered, large) -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="72" stroke="#d4a843" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="42" fill="#d4a843" opacity="0.15"/>
    <circle cx="0" cy="0" r="28" fill="#d4a843" opacity="0.3"/>
  </g>

  <!-- Main title: Хоккей Шерегеша -->
  <text x="600" y="395" text-anchor="middle"
        font-family="Oswald, 'Arial Narrow', sans-serif"
        font-size="64" font-weight="700" fill="#f1f5f9"
        letter-spacing="2">ХОККЕЙ ШЕРЕГЕША</text>

  <!-- Subtitle: Sheregesh Hockey -->
  <text x="600" y="445" text-anchor="middle"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="24" font-weight="400" fill="#cbd5e1"
        letter-spacing="4">SHEREGESH HOCKEY</text>

  <!-- Decorative accent line below subtitle -->
  <rect x="480" y="470" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <!-- Tagline -->
  <text x="600" y="510" text-anchor="middle"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="16" fill="#cbd5e1" opacity="0.7"
        letter-spacing="2">ИСТОРИЯ ДВОРОВОГО ХОККЕЯ</text>

  <!-- Accent line bottom -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>

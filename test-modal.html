<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Modal</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      background: #0d1117;
      color: #fff;
    }

    .test-btn {
      padding: 12px 24px;
      background: #00875A;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    /* MODAL STYLES */
    .news-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .news-modal:not([hidden]) {
      display: flex;
    }

    .news-modal[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      display: flex !important;
    }

    .news-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      cursor: pointer;
    }

    .news-modal__content {
      position: relative;
      max-width: 600px;
      width: 90%;
      background: #161b22;
      border: 2px solid #00875A;
      border-radius: 12px;
      padding: 40px;
      transform: scale(0.8) translateY(30px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .news-modal[aria-hidden="false"] .news-modal__content {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .news-modal__close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 2px solid #00875A;
      background: #161b22;
      border-radius: 50%;
      cursor: pointer;
      color: #00875A;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .debug {
      margin-top: 20px;
      padding: 20px;
      background: #1c2128;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Тест модального окна</h1>
  <button class="test-btn" onclick="openModal()">Открыть модальное окно</button>

  <div class="debug">
    <div id="debug-info">Нажмите кнопку чтобы открыть модальное окно</div>
  </div>

  <!-- MODAL -->
  <div id="news-modal" class="news-modal" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <div class="news-modal__backdrop" onclick="closeModal()"></div>
    <div class="news-modal__content">
      <button type="button" class="news-modal__close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <h2>Тестовое модальное окно</h2>
      <p>Если вы видите этот текст, модальное окно работает корректно!</p>
      <p>Браузер: <span id="browser-info"></span></p>
      <p>Ширина окна: <span id="width-info"></span>px</p>
    </div>
  </div>

  <script>
    // Информация о браузере
    document.getElementById('browser-info').textContent = navigator.userAgent.includes('Mobile') ? 'Mobile' : 'Desktop';
    document.getElementById('width-info').textContent = window.innerWidth;

    function openModal() {
      var modal = document.getElementById('news-modal');
      var debug = document.getElementById('debug-info');

      debug.innerHTML = 'Открываем модальное окно...<br>';

      // Log before
      debug.innerHTML += 'Before: hidden=' + modal.hasAttribute('hidden') + ', aria-hidden=' + modal.getAttribute('aria-hidden') + '<br>';

      modal.removeAttribute('hidden');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      // Log after
      setTimeout(function() {
        debug.innerHTML += 'After: hidden=' + modal.hasAttribute('hidden') + ', aria-hidden=' + modal.getAttribute('aria-hidden') + '<br>';
        debug.innerHTML += 'Computed display: ' + window.getComputedStyle(modal).display + '<br>';
        debug.innerHTML += 'Computed opacity: ' + window.getComputedStyle(modal).opacity + '<br>';
        debug.innerHTML += 'Computed visibility: ' + window.getComputedStyle(modal).visibility + '<br>';
      }, 100);
    }

    function closeModal() {
      var modal = document.getElementById('news-modal');
      var debug = document.getElementById('debug-info');

      modal.setAttribute('aria-hidden', 'true');
      modal.setAttribute('hidden', '');
      document.body.style.overflow = '';

      debug.innerHTML += 'Модальное окно закрыто<br>';
    }

    // Close on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        var modal = document.getElementById('news-modal');
        if (modal.getAttribute('aria-hidden') === 'false') {
          closeModal();
        }
      }
    });
  </script>
</body>
</html>

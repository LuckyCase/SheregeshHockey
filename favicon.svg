<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
 <!-- Black background -->
 <rect fill="#000" width="32" height="32"/>

 <!-- Large puck (centered, bigger) -->
 <ellipse cx="16" cy="16" rx="12" ry="5" fill="#2c2724"/>
 <ellipse cx="16" cy="15" rx="11" ry="4" fill="#3d3b36"/>

 <!-- Simple crossed sticks (gold, bold) -->
 <line x1="4" y1="8" x2="28" y2="8" stroke="#d4a843" stroke-width="3" stroke-linecap="round"/>
 <line x1="6" y1="4" x2="6" y2="12" stroke="#d4a843" stroke-width="2.5" stroke-linecap="round"/>
 <line x1="26" y1="4" x2="26" y2="12" stroke="#d4a843" stroke-width="2.5" stroke-linecap="round"/>

 <!-- Gold circle border -->
 <circle cx="16" cy="16" r="14.5" fill="none" stroke="#d4a843" stroke-width="2"/>
</svg>

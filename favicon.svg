<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
 <!-- Dark blue background (история theme) -->
 <circle cx="16" cy="16" r="16" fill="#1a3a5c"/>

 <!-- Hockey puck (black with highlight) -->
 <ellipse cx="16" cy="18" rx="8" ry="3" fill="#1f1a17"/>
 <ellipse cx="16" cy="17.5" rx="7.5" ry="2.5" fill="#2c2724"/>

 <!-- Crossed sticks (gold accent) -->
 <line x1="8" y1="10" x2="24" y2="10" stroke="#d4a843" stroke-width="2" stroke-linecap="round"/>
 <line x1="10" y1="8" x2="10" y2="12" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round"/>
 <line x1="22" y1="8" x2="22" y2="12" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round"/>

 <!-- Circle border (gold) -->
 <circle cx="16" cy="16" r="15" fill="none" stroke="#d4a843" stroke-width="1" opacity="0.5"/>
</svg>
